<!--
  Supabase "Confirm signup" email template.
  Paste into: Supabase Dashboard -> Authentication -> Email Templates -> Confirm signup
  (replace the whole template body with this).

  {{ .Token }} and {{ .ConfirmationURL }} are Supabase's own variables - both are
  substituted automatically, don't edit them. This app's verify-email screen expects
  the 6-digit code, so that's the primary path here; the button is a one-tap
  alternative for anyone who'd rather not type it in.
-->
<div style="background-color:#0a0807;padding:40px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;margin:0 auto;">
    <tr>
      <td align="center" style="padding-bottom:32px;">
        <img
          src="https://madgigz-app.vercel.app/logos/madgigz-wordmark.png"
          alt="MadGigz"
          width="140"
          style="display:block;"
        />
      </td>
    </tr>
    <tr>
      <td style="background-color:#171210;border-radius:24px;padding:32px 28px;">
        <p style="margin:0 0 8px;font-size:20px;line-height:1.3;color:#f3f1d1;font-weight:700;">
          Confirm your email
        </p>
        <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#a89f8c;">
          Welcome to MadGigz. Enter this code in the app to verify it&#39;s really you:
        </p>

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 24px;">
          <tr>
            <td align="center" style="background-color:#0a0807;border:1px solid #33291f;border-radius:16px;padding:18px 12px;">
              <span style="font-size:32px;font-weight:700;letter-spacing:10px;color:#f3f1d1;">
                {{ .Token }}
              </span>
            </td>
          </tr>
        </table>

        <p style="margin:0 0 16px;font-size:13px;line-height:1.6;color:#a89f8c;">
          Or skip typing it in and confirm in one tap:
        </p>

        <!-- Bulletproof button: a table cell with padding + background renders correctly
             in Outlook too, unlike a plain <a> styled to look like a button. -->
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 24px;">
          <tr>
            <td style="border-radius:999px;background-color:#d76616;">
              <a
                href="{{ .ConfirmationURL }}"
                target="_blank"
                style="display:inline-block;padding:14px 32px;font-size:15px;font-weight:700;color:#f3f1d1;text-decoration:none;"
              >
                Confirm email
              </a>
            </td>
          </tr>
        </table>

        <p style="margin:0;font-size:12px;line-height:1.6;color:#7a7266;">
          Didn&#39;t sign up for MadGigz? You can safely ignore this email.
        </p>
      </td>
    </tr>
    <tr>
      <td align="center" style="padding-top:24px;">
        <p style="margin:0;font-size:11px;color:#7a7266;">
          MadGigz &middot; a product of AuraSonic SL
        </p>
      </td>
    </tr>
  </table>
</div>
