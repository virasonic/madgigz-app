<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MadGigz — Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem;
        text-align: center;
        background: #0a0807;
        color: #f3f1d1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .pin {
        width: 44px;
        height: 44px;
        color: #54c3bd;
      }
      h1 {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 700;
      }
      p {
        margin: 0;
        max-width: 22rem;
        line-height: 1.5;
        color: #a89f8c;
        font-size: 0.95rem;
      }
      button {
        margin-top: 0.5rem;
        border: 0;
        border-radius: 9999px;
        padding: 0.75rem 1.75rem;
        background: #d76616;
        color: #f3f1d1;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.97);
      }
      a.tickets {
        color: #54c3bd;
        text-decoration: underline;
        text-underline-offset: 4px;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <svg class="pin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M12 21s-6-5.686-6-10a6 6 0 1 1 12 0c0 4.314-6 10-6 10Z"
        stroke="currentColor"
        stroke-width="2"
        stroke-linejoin="round"
      />
      <circle cx="12" cy="11" r="2" fill="currentColor" />
    </svg>
    <h1>You&rsquo;re offline</h1>
    <p>MadGigz needs a connection to load live gigs and tickets. Check your network and try again.</p>
    <button onclick="location.reload()">Try again</button>
    <a class="tickets" href="/tickets">Open your saved tickets &rarr;</a>
  </body>
</html>
